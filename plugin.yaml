name: aphrodite
version: 2.0.8
description: "CCR compression plugin - 28-type classifier, 13 tools, dylib hot-reload, context engine, TOML-driven templates."
kind: standalone
min_hermes_version: "0.16.0"
requires_hooks: true
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - aphrodite_retrieve
  - aphrodite_compress
  - aphrodite_stats
  - aphrodite_rebuild
  - aphrodite_files
  - aphrodite_diff
  - aphrodite_search
  - aphrodite_directive
  - aphrodite_test
  - aphrodite_catalog
  - aphrodite_reclassify
  - aphrodite_prefetch
  - aphrodite_prefetch_status
  - aphrodite_navigate
provides_context_engine: true
# Engine threshold: -1=always compress, 0=disabled, >0=fill%
# Ships 9 skills: auto-expand-testing, benchmarking, cargo-upgrade, development-lessons,
# hook-reference, operations, release-workflow, upgrade-breakpoints, v0.8.6-patterns
install_message: |
  aphrodite v2.0.8 - CCR compression plugin for Hermes Agent (Rust-powered).
  All logic in libaphrodite_hermes.dylib - __init__.py is a thin registration shim.
  Proxies: token (:9798, SQLite, >1KB), cache (:9797, in-memory, >8KB).
  Engine: context_engine=true in aphrodite.toml (default-on).
  Download: bash download.sh (fetches prebuilt binary + dylib from GitHub Releases).
  Tools: retrieve, compress, stats, rebuild, files, diff, search, directive, test, catalog, reclassify, prefetch, prefetch_status
