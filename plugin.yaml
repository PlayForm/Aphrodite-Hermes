name: aphrodite
version: 1.62.63
description: "CCR compression plugin - 28-type classifier, 12 tools, context engine, TOML-driven templates."
kind: standalone
min_hermes_version: "0.16.0"
requires_hooks: true
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - aphrodite_retrieve
  - aphrodite_compress
  - aphrodite_stats
  - aphrodite_rebuild
  - aphrodite_files
  - aphrodite_diff
  - aphrodite_search
  - aphrodite_test
  - aphrodite_catalog
  - aphrodite_reclassify
  - aphrodite_prefetch
  - aphrodite_prefetch_status
provides_context_engine: true
# Engine threshold: -1=always compress, 0=disabled, >0=fill%
# Ships 9 skills: compression architecture, proxy lifecycle, tool guide, context engine, coding defaults, context efficiency, boundary behaviors, output formatting, presentation
install_message: |
  aphrodite v1.62.63 — CCR compression plugin for Hermes Agent (Rust-powered).
  All logic in libaphrodite.dylib — __init__.py is a thin registration shim.
  Proxies: token (:9798, SQLite, >1KB), cache (:9797, in-memory, >8KB).
  Engine: context_engine=true in aphrodite.toml (default-on).
  Download: bash download.sh (fetches prebuilt binary from GitHub Releases).
  Tools: retrieve, compress, stats, rebuild, files, diff, search, test, catalog, reclassify, prefetch, prefetch_status
