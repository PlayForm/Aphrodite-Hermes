name: aphrodite
version: 2.3.0
description: "CCR compression plugin - multi-type classifier, 13 tools, default-on context engine (middle-turn archiving + engine_offload), TOML-driven templates, auto-expand, live containers, prompt knobs, recursion/body caps, optional Rhai scripting. Priced retrieval: a marker's size is its retrieval cost - previews answer structural questions, deferral is safe, batch the retrievals you need. Disclosure - pre_tool_call auto-backgrounds long terminal/process commands (modify: background=true, notify_on_complete=true) and rewrites chained terminal commands when enabled."
kind: standalone
requires_hermes: ">=0.20.2"
requires_hooks: true
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
  - pre_tool_call
provides_tools:
  - aphrodite_retrieve
  - aphrodite_compress
  - aphrodite_stats
  - aphrodite_rebuild
  - aphrodite_files
  - aphrodite_diff
  - aphrodite_search
  - aphrodite_directive
  - aphrodite_test
  - aphrodite_catalog
  - aphrodite_reclassify
  - aphrodite_prefetch
  - aphrodite_prefetch_status
provides_context_engine: true
# Engine threshold: -1=always compress, 0=disabled, >0=fill%
# Skills are NOT shipped with the plugin - they live dev-side in the monorepo's
# .hermes/skills/ (Development branch only).
install_message: |
  aphrodite v2.3.0 - CCR compression plugin for Hermes Agent (Rust-powered).
  All logic in libaphrodite_hermes.dylib - __init__.py is a thin registration shim.
  Proxies: token (:9798, SQLite, >1KB), cache (:9797, in-memory, >8KB).
  Engine: default-on context engine - compresses overflowing middle turns once context fills past engine_threshold_pct (default 30; 100+ disables). Guard the conversation edges with engine_protect_first / engine_protect_last / engine_min_msgs.
  Features: TOML [templates] (preview/marker/prompts/reverse format strings), auto-expand (inline marker resolution; auto_expand / auto_expand_limit), live containers (instant 'live' markers; APHRODITE_LIVE_CONTAINER or live_container=true), prompt knobs (retrieve_guidance / ccr_marker_hint / catalog_intent_hints), caps (APHRODITE_RECURSIVE_DEPTH default 5; APHRODITE_MAX_REQUEST_BODY_SIZE optional), optional Rhai scripting ('scripting' Cargo feature, rhai pinned 1.25.1).
  Priced retrieval: a marker's size is its retrieval cost - previews answer structural questions (succeeded? which files? how many?); deferral is safe, batch the retrievals you need into one turn.
  Download: bash download.sh (fetches prebuilt binary + dylib from GitHub Releases).
  LLM API key: REQUIRED - set APHRODITE_API_KEY (or 'aphrodite setup' / api_key in ~/.hermes/aphrodite/aphrodite.toml). Hermes' provider config is NOT reused - see README 'LLM provider configuration'.
  Tools: retrieve, compress, stats, rebuild, files, diff, search, directive, test, catalog, reclassify, prefetch, prefetch_status
